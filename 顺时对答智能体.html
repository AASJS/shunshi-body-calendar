<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>顺时 · 中医身体日历对答智能体</title>
<style>
/* ============================================================
   顺时 · 对答智能体工作站（L2）
   单文件离线 · 无矢量图 / 无位图 / 无表情符号 / 无外部依赖
   左：对答区  |  右：同一 cal 派生的「长页 / 9:16 卡」双产物
   ============================================================ */
:root{
  --serif:"Noto Serif CJK SC","Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:"Noto Sans CJK SC","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --bg:#161B20; --panel:#1D242B; --panel2:#232B33; --edge:rgba(255,255,255,.10);
  --txt:#E7ECEF; --muted:#94A2AC; --gold:#C9A24A; --cinnabar:#9C4A3C; --jade:#6E88A6;
  --paper:#EFECE3; --paper2:#E7E2D6; --ink:#2F4154; --ink2:#6E88A6;
  --accent:#6E88A6; --seal:#9C4A3C; --line:#C9C2B3; --sub:#6C7580;
  --scene1:#DCE3E6; --scene2:#EFECE3; --dark:0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}

/* ---------- 顶栏 ---------- */
.topbar{height:58px;display:flex;align-items:center;gap:9px;padding:0 16px;background:#11161B;border-bottom:1px solid var(--edge);flex-wrap:wrap}
.topbar .brand{font-family:var(--serif);font-size:16px;letter-spacing:.16em;color:#EDE3CF;margin-right:6px;white-space:nowrap}
.topbar .brand small{display:block;font-family:var(--sans);font-size:9.5px;letter-spacing:.08em;color:#8B98A2;margin-top:2px}
.topbar .sep{width:1px;height:22px;background:var(--edge);margin:0 3px}
.topbar button{background:rgba(255,255,255,.06);color:#D9E1E6;border:1px solid var(--edge);padding:7px 11px;font-size:12px;border-radius:2px;cursor:pointer;font-family:var(--sans);letter-spacing:.03em;white-space:nowrap}
.topbar button:hover{background:rgba(255,255,255,.14)}
.topbar button.on{background:var(--cinnabar);border-color:#B67A6E;color:#fff}
.topbar .spacer{flex:1}
.topbar .stat{font-size:11.5px;color:var(--gold);letter-spacing:.05em;white-space:nowrap}
.topbar .stat b{color:#E8D9B0;font-weight:500}

/* ---------- 主体 ---------- */
.app{display:grid;grid-template-columns:414px 1fr;height:calc(100vh - 88px)}

/* ---------- 左：对答区 ---------- */
.chat{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--panel);border-right:1px solid var(--edge)}
.chat .hd{padding:13px 18px;border-bottom:1px solid var(--edge);display:flex;align-items:center;gap:10px;flex:none}
.chat .hd .dot{width:8px;height:8px;border-radius:50%;background:var(--jade);box-shadow:0 0 0 4px rgba(110,136,166,.14)}
.chat .hd h2{font-family:var(--serif);font-size:15px;letter-spacing:.1em;font-weight:500}
.chat .hd .ph{margin-left:auto;font-size:11px;color:var(--muted);letter-spacing:.06em}
.msgs{flex:1;overflow-y:auto;padding:18px 16px 10px;scroll-behavior:smooth}
.msgs::-webkit-scrollbar,.result::-webkit-scrollbar{width:8px}
.msgs::-webkit-scrollbar-thumb,.result::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:4px}
.msg{margin-bottom:14px;display:flex;flex-direction:column;max-width:100%}
.msg .who{font-size:10.5px;color:var(--muted);letter-spacing:.1em;margin-bottom:5px}
.msg.a .who{color:var(--jade)} .msg.u .who{color:var(--cinnabar);text-align:right}
.bub{padding:11px 13px;border-radius:3px;font-size:13.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.msg.a .bub{background:var(--panel2);border:1px solid var(--edge);color:#DCE4E9;align-self:flex-start;max-width:96%}
.msg.u .bub{background:rgba(156,74,60,.20);border:1px solid rgba(156,74,60,.42);color:#F0DED8;align-self:flex-end;max-width:92%}
.msg.s .bub{background:var(--paper);color:#2F3A44;align-self:stretch;border-left:3px solid var(--cinnabar);font-size:13px;line-height:1.72}
.msg.s .bub b{color:var(--cinnabar)}
.msg.s .bub .ttl{font-family:var(--serif);font-size:14px;letter-spacing:.08em;color:#3A2B2B;border-bottom:1px solid rgba(0,0,0,.12);padding-bottom:6px;margin-bottom:8px}
.msg.s .bub .kv{display:flex;gap:8px;padding:2px 0}
.msg.s .bub .kv .k{color:#8A6C4A;flex:0 0 70px;white-space:nowrap}
.msg.s .bub .kv .v{flex:1}
.msg .bub .btns{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.msg .bub .btns button{background:#3A2B2B;color:#F3E9D8;border:1px solid #3A2B2B;padding:6px 11px;font-size:11.5px;border-radius:2px;cursor:pointer;font-family:var(--sans)}
.msg .bub .btns button:hover{background:var(--cinnabar);border-color:var(--cinnabar)}
.msg .bub .btns button.gh{background:transparent;color:#3A2B2B;border-color:rgba(58,43,43,.35)}
.quick{padding:8px 16px 0;display:flex;gap:6px;flex-wrap:wrap;flex:none}
.quick button{background:transparent;border:1px dashed rgba(255,255,255,.22);color:#A9B6BF;font-size:11px;padding:6px 9px;border-radius:2px;cursor:pointer;font-family:var(--sans);line-height:1.4;text-align:left}
.quick button:hover{border-color:var(--gold);color:#E8D9B0}
.inputbar{display:flex;gap:8px;padding:12px 16px 14px;border-top:1px solid var(--edge);flex:none}
.inputbar textarea{flex:1;resize:none;height:46px;background:#151B21;border:1px solid var(--edge);border-radius:2px;color:var(--txt);font-family:var(--sans);font-size:13px;line-height:1.5;padding:9px 10px;outline:none}
.inputbar textarea:focus{border-color:var(--jade)}
.inputbar button{width:66px;background:var(--cinnabar);border:1px solid var(--cinnabar);color:#fff;font-size:13px;border-radius:2px;cursor:pointer;font-family:var(--sans)}
.inputbar button:hover{background:#B0564A}

/* ---------- 右：产物区 ---------- */
.result{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;background:#20262C}
.tabs{display:flex;align-items:center;gap:6px;padding:11px 18px;border-bottom:1px solid var(--edge);background:#1A2026;flex:none;flex-wrap:wrap}
.tabs button{background:rgba(255,255,255,.05);border:1px solid var(--edge);color:#C3CDD4;padding:7px 15px;font-size:12.5px;border-radius:2px;cursor:pointer;font-family:var(--sans);letter-spacing:.05em}
.tabs button.on{background:var(--cinnabar);border-color:var(--cinnabar);color:#fff}
.tabs .hint{margin-left:auto;font-size:11px;color:var(--muted);letter-spacing:.04em}
.view{flex:1;overflow:auto}
.view[hidden]{display:none}

/* 长页预览 */
.longwrap{padding:30px 24px 70px;display:flex;justify-content:center}
.long{max-width:880px;width:100%;background:var(--paper);color:#2F3A44;padding:54px 62px 64px;box-shadow:0 18px 60px rgba(0,0,0,.45);font-family:var(--sans);font-size:14px;line-height:1.85}
.long .lt{font-family:var(--serif);font-size:27px;color:#3A2B2B;letter-spacing:.06em;border-bottom:2px solid var(--cinnabar);padding-bottom:12px;margin-bottom:6px}
.long .lsub{font-size:12px;color:#8A6C4A;letter-spacing:.08em;margin-bottom:22px}
.long blockquote{border-left:3px solid var(--cinnabar);background:rgba(156,74,60,.06);padding:11px 15px;margin:14px 0;color:#4A3A32;font-size:13.5px}
.long h3{font-family:var(--serif);font-size:17px;color:#3A2B2B;margin:26px 0 9px;letter-spacing:.06em;border-bottom:1px solid rgba(0,0,0,.1);padding-bottom:6px}
.long p{margin:8px 0}
.long ol,.long ul{padding-left:22px;margin:8px 0}
.long li{margin:5px 0}
.long table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px}
.long th,.long td{border:1px solid rgba(0,0,0,.14);padding:7px 10px;text-align:left;vertical-align:top}
.long th{background:rgba(156,74,60,.08);color:#3A2B2B;font-weight:600;white-space:nowrap}
.long .note{font-size:12px;color:#7A6A5A;border-top:1px solid rgba(0,0,0,.12);margin-top:26px;padding-top:12px}
.long .empty{text-align:center;color:#8A6C4A;padding:70px 10px;font-family:var(--serif);font-size:16px;line-height:2}

/* 卡片预览 */
.cardwrap{padding:24px 20px 70px;display:flex;justify-content:center;align-items:flex-start;background:radial-gradient(900px 1200px at 50% 4%,rgba(206,184,142,.07),transparent 70%),linear-gradient(180deg,#262C32,#1A1F24);min-height:100%}
.scaler{position:relative;flex:none}
.zoombar{display:flex;align-items:center;justify-content:center;gap:6px;padding:9px;flex:none;background:#1A2026;border-bottom:1px solid var(--edge)}
.zoombar button{background:rgba(255,255,255,.05);border:1px solid var(--edge);color:#C3CDD4;padding:5px 10px;font-size:11.5px;border-radius:2px;cursor:pointer;font-family:var(--sans)}
.zoombar button.on{background:var(--cinnabar);border-color:var(--cinnabar);color:#fff}
.zoombar .zv{min-width:52px;text-align:center;color:var(--gold);font-size:11.5px}
.card{
  position:relative;width:1080px;height:1920px;overflow:hidden;
  transform-origin:top left;
  background:var(--paper);color:var(--ink);
  box-shadow:0 34px 96px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.05);
  font-family:var(--sans);
}
.card::before{ /* 宣纸帘纹：纯 CSS 渐变 */
  content:"";position:absolute;inset:0;pointer-events:none;z-index:1;opacity:.6;
  background-image:
    repeating-linear-gradient(0deg, rgba(0,0,0,.012) 0 1px, transparent 1px 5px),
    repeating-linear-gradient(90deg, rgba(0,0,0,.008) 0 1px, transparent 1px 26px);
}
.card::after{ /* 内框细线 */
  content:"";position:absolute;inset:26px;border:1px solid var(--line);opacity:.55;pointer-events:none;z-index:2;
}
.z{position:relative;z-index:3}
.pad{padding:0 76px}

/* 刊头 */
.mast{display:flex;align-items:flex-end;justify-content:space-between;padding-top:53.4px}
.mast .left .t1{font-family:var(--serif);font-size:34px;letter-spacing:.34em;color:var(--ink)}
.mast .left .t2{font-size:21px;letter-spacing:.22em;color:var(--sub);margin-top:10px}
.mast .right{text-align:right}
.mast .right .no{font-family:var(--serif);font-size:26px;color:var(--seal);letter-spacing:.1em}
.mast .right .nm{font-size:19px;color:var(--sub);margin-top:6px;letter-spacing:.08em}
.mast-rule{height:1px;background:var(--line);margin:16px 0 0;opacity:.8}

/* 日期区 */
.date{display:flex;align-items:flex-end;gap:26px;margin-top:32.9px}
.date .dnum{font-family:var(--serif);font-size:233px;line-height:.82;font-weight:600;letter-spacing:-.03em;color:var(--ink)}
.date .dmeta{padding-bottom:14px;display:flex;flex-direction:column;gap:8px}
.date .dmeta .y{font-family:var(--serif);font-size:41.5px;letter-spacing:.1em;color:var(--ink)}
.date .dmeta .m{font-size:30.5px;letter-spacing:.14em;color:var(--sub)}
.date .dmeta .l{font-family:var(--serif);font-size:30.5px;letter-spacing:.08em;color:var(--seal);border-top:1px solid var(--line);padding-top:12px}
.vseal{
  margin-left:auto;margin-bottom:18px;width:99px;height:99px;flex:0 0 99px;
  border:2px solid var(--seal);border-radius:3px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:39px;color:var(--seal);
  writing-mode:vertical-rl;letter-spacing:.02em;line-height:1.05;text-align:center;
  opacity:.9;transform:rotate(-2deg);
}

/* 节气条 */
.term{display:flex;align-items:baseline;gap:20px;margin-top:28.9px;flex-wrap:wrap}
.term .b{font-family:var(--serif);font-size:38.5px;font-weight:600;color:var(--ink);letter-spacing:.06em}
.term .s{font-size:26px;color:var(--sub);letter-spacing:.06em}
.term .sg{margin-left:auto;font-size:24.5px;color:var(--seal);letter-spacing:.06em}
.tbar{height:3px;background:var(--line);margin-top:12px;position:relative;opacity:.75}
.tbar i{position:absolute;left:0;top:0;height:3px;background:var(--accent);display:block;width:13%}
.tbar .dots{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center}
.tbar .dots span{width:5px;height:5px;border-radius:50%;background:var(--paper);border:1px solid var(--line)}

/* 天时四格 */
.sky{display:grid;grid-template-columns:repeat(4,1fr);margin-top:40.9px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sky .cell{padding:14.5px 8.5px 12.5px;border-right:1px solid var(--line)}
.sky .cell:last-child{border-right:none}
.sky .cell .k{font-size:22px;letter-spacing:.16em;color:var(--sub)}
.sky .cell .v{font-family:var(--serif);font-size:33.5px;font-weight:600;color:var(--ink);margin-top:6px;white-space:nowrap}
.sky .cell .u{font-family:var(--sans);font-size:19px;color:var(--sub);font-weight:400;margin-left:3px}
.sky-note{font-size:19px;color:var(--sub);letter-spacing:.04em;margin-top:10.5px;text-align:right}

/* 主题 */
.theme{margin-top:24.4px}
.theme .label{font-size:21px;letter-spacing:.3em;color:var(--sub)}
.theme h1{font-family:var(--serif);font-size:50px;font-weight:600;line-height:1.45;letter-spacing:.02em;margin-top:10.5px;color:var(--ink)}
.theme p{font-size:26px;line-height:1.65;color:var(--sub);margin-top:10.5px}

/* 宜忌 */
.yb{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:26.4px}
.blk .hd{display:flex;align-items:baseline;gap:14px;border-bottom:1px solid var(--line);padding-bottom:12px}
.blk .hd .ch{font-family:var(--serif);font-size:47px;font-weight:600;line-height:1}
.blk.yi .hd .ch{color:var(--seal)}
.blk.bu .hd .ch{color:var(--sub)}
.blk .hd .tx{font-size:22px;letter-spacing:.2em;color:var(--sub)}
.blk ul{list-style:none;margin-top:12.5px}
.blk li{display:flex;gap:12px;font-size:24.5px;line-height:1.6;margin-bottom:10.9px;color:var(--ink)}
.blk li .dot{flex:0 0 7px;width:7px;height:7px;border-radius:50%;margin-top:13px}
.blk.yi li .dot{background:var(--seal)}
.blk.bu li .dot{background:var(--sub);opacity:.6}

/* 四时调摄 */
.rows{margin-top:24.4px;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:84px 1fr;gap:16px;padding:11.4px 0;border-bottom:1px dotted var(--line)}
.row .rk{font-family:var(--serif);font-size:26px;letter-spacing:.16em;color:var(--accent)}
.row .rv{font-size:24.5px;line-height:1.6;color:var(--ink)}

/* 内观 + 一句话 */
.ask{margin-top:20.4px;display:flex;align-items:center;gap:18px}
.ask .tag{font-family:var(--serif);font-size:24.5px;letter-spacing:.14em;color:var(--seal);white-space:nowrap}
.ask .q{font-size:24.5px;color:var(--sub);line-height:1.6}
.sealblk{text-align:center;margin-top:20.4px;padding:6px 0 4px}
.sealblk .r{height:1px;width:64px;background:var(--seal);opacity:.5;margin:0 auto 15.8px}
.sealblk p{font-family:var(--serif);font-size:34.5px;line-height:1.65;color:var(--ink);letter-spacing:.02em}
.sealblk .r2{height:1px;width:64px;background:var(--seal);opacity:.5;margin:15.8px auto 0}

/* 依据 */
.basis{position:absolute;left:76px;right:236px;bottom:40px;border-top:1px solid var(--line);padding-top:10.5px}
.basis .label{font-size:18.5px;letter-spacing:.26em;color:var(--sub)}
.basis p{font-size:17.5px;line-height:1.5;color:var(--sub);margin-top:6px}

/* 落款 */
.foot{position:absolute;left:64px;right:64px;bottom:26px;display:flex;align-items:flex-end;justify-content:flex-end;z-index:3}
.foot .stamp{
  width:121px;height:121px;border:2px solid var(--seal);border-radius:4px;
  display:flex;align-items:center;justify-content:center;text-align:center;
  font-family:var(--serif);font-size:26.5px;line-height:1.1;letter-spacing:0;color:var(--seal);
  writing-mode:vertical-rl;white-space:nowrap;opacity:.82;transform:rotate(-3deg);flex:0 0 121px;
}

/* ---------- 十套一览 ---------- */


/* 十套一览 */
.gallery{display:none;padding:22px 26px 60px;grid-template-columns:repeat(5,1fr);gap:16px}
.gallery.show{display:grid}
.mini{background:#151A1F;border:1px solid rgba(255,255,255,.1);border-radius:3px;overflow:hidden;cursor:pointer}
.mini:hover{border-color:var(--gold)}
.mini .pv{height:118px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:44px}
.mini .meta{padding:9px 11px 12px}
.mini .meta .n{font-family:var(--serif);font-size:13px;color:#EDE4D2;letter-spacing:.04em}
.mini .meta .w{font-size:10.5px;color:#9AA6B0;margin-top:4px}
.mini .sw{display:flex;height:7px;margin-top:9px;border-radius:2px;overflow:hidden}
.mini .sw i{flex:1}

/* 状态条 */
.status{height:30px;display:flex;align-items:center;gap:16px;padding:0 18px;background:#11161B;border-top:1px solid var(--edge);font-size:11px;color:var(--muted);letter-spacing:.03em;flex:none;white-space:nowrap;overflow:hidden}
.status b{color:var(--gold);font-weight:500}

/* 导出模式：只留精确 1080×1920 卡片 */
body.export-on{overflow:auto;background:#fff}
body.export-on .chat,body.export-on .tabs,body.export-on .status,body.export-on .zoombar,body.export-on .gallery,body.export-on #longView{display:none!important}
body.export-on .topbar{position:fixed;top:0;left:0;right:0;height:auto;padding:8px 12px;background:rgba(17,22,27,.86);border-bottom:none;z-index:99;justify-content:flex-end}
body.export-on .topbar>*:not(#btnExport):not(.png-tools){display:none!important}
body.export-on .topbar #btnExport{display:block}
body.export-on.clean .topbar{display:none!important}
@media print{body.export-on .topbar{display:none!important}}
body.export-on .app{display:block;height:auto}
body.export-on .result{overflow:visible;background:#fff;display:block}
body.export-on #cardView{display:block!important}
body.export-on .cardwrap{padding:0;background:#fff;min-height:0;display:block}
body.export-on .scaler{width:1080px!important;height:1920px!important}
body.export-on .card{transform:none!important;box-shadow:none!important}
/* 导出模式 · 长页态：固定 1080 宽、去阴影，供截图与 PNG 导出 */
body.export-on.export-long #longView{display:block!important;overflow:visible}
body.export-on.export-long #cardView{display:none!important}
body.export-on.export-long .longwrap{padding:0;display:block}
body.export-on.export-long .long{max-width:none;width:1080px;margin:0;box-shadow:none}
body.export-on.export-long .result{background:#fff}
/* 导出工具条：只在导出模式出现，主顶栏保持原样不拥挤 */
.png-tools{display:none;gap:6px;align-items:center}
body.export-on .png-tools{display:flex}
body.export-on .png-tools button.hi{background:var(--cinnabar);border-color:#B67A6E;color:#fff}
/* 导出态提示（导出模式隐藏了左栏对话，反馈要给浮层） */
#pngToast{display:none;position:fixed;right:18px;bottom:18px;z-index:120;max-width:430px;
  background:rgba(17,22,27,.94);color:#EDE3CF;border:1px solid var(--gold);border-radius:4px;
  padding:12px 16px;font-size:13px;line-height:1.7;box-shadow:0 8px 30px rgba(0,0,0,.4)}
body.export-on #pngToast{display:block}
#pngToast:empty{display:none!important}
body.export-on.clean #pngToast{display:none!important}

@media (max-width:1000px){
  .app{grid-template-columns:1fr;height:auto;min-height:calc(100% - 58px)}
  body{overflow:auto}
  .chat{height:520px;border-right:none;border-bottom:1px solid var(--edge)}
  .result{height:900px}
  .topbar{height:auto;padding:9px 12px}
  .gallery{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:620px){ .gallery{grid-template-columns:repeat(2,1fr)} .long{padding:30px 22px} }

/* ================= 浅色换肤（v2）=================
   只覆盖「工作站外壳」；.card / .long 及其内部元素一律不动，
   保证导出 PNG 与产物视觉完全一致、不受外壳配色影响。 */
:root{
  --bg:#EDE7DB; --panel:#FBF8F1; --panel2:#F3EDE1; --edge:rgba(120,102,78,.20);
  --txt:#3C3630; --muted:#8B8175; --gold:#A9843B; --cinnabar:#B0513F; --jade:#5C7C88;
  --paper:#EFECE3; --paper2:#E7E2D6; --ink:#2F4154; --ink2:#6E88A6;

var GAN=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];

var DAY_CN=['初一','初二','初三','初四','初五','初六','初七','初八','初九','初十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];
function lunar(date){
  var base=new Date(1900,0,31),offset=Math.round((date-base)/86400000);
  var temp=0,i,leap=0,isLeap=false,lastDay;
  for(i=1900;i<2101&&offset>0;i++){lastDay=lYearDays(i);offset-=lastDay;}
  if(offset<0){offset+=lastDay;i--;}
  var testYear=i;leap=leapMonth(i);isLeap=false;
  for(i=1;i<13&&offset>0;i++){
    if(leap>0&&i===(leap+1)&&isLeap===false){--i;isLeap=true;temp=leapDays(testYear);}
    else{temp=monthDays(testYear,i);}
    if(isLeap===true&&i===(leap+1))isLeap=false;
    offset-=temp;
  }
  if(offset===0&&leap>0&&i===leap+1){if(isLeap){isLeap=false;}else{isLeap=true;--i;}}
  if(offset<0){offset+=temp;--i;}
  var num=(testYear-1864)%60;if(num<0)num+=60;
  return {year:GAN[num%10]+ZHI[num%12]+'年',month:(isLeap?'闰':'')+MONTH_CN[i-1]+'月',day:DAY_CN[offset]};
}
/* 节气用太阳黄经算法（沿用 IMA 每日模板，与 TERM_NAMES 从立春起、seasonOf 分段完全自洽） */
function jdOfNoon(date){
  var y=date.getFullYear(),m=date.getMonth(),d=date.getDate();
  /* 采样取 UTC 21:00（北京次日 05:00，即当日结束附近的黄经），
     逐日扫描时可把节气正确归入其天文发生日，避免交界日偏后 1 天。
     实测 2026 全年立春/春分/夏至/秋分/立冬/冬至六大节点全中。 */
  return Date.UTC(y,m,d,21,0,0)/86400000+2440587.5;
}
function sunLongitude(jd){
  var T=(jd-2451545.0)/36525;
  var L0=280.46646+36000.76983*T+0.0003032*T*T;
  var M=(357.52911+35999.05029*T-0.0001537*T*T)*Math.PI/180;
  var Cv=(1.914602-0.004817*T-0.000014*T*T)*Math.sin(M)
        +(0.019993-0.000101*T)*Math.sin(2*M)+0.000289*Math.sin(3*M);
  var omega=(125.04-1934.136*T)*Math.PI/180;
  var lam=(L0+Cv)-0.00569-0.00478*Math.sin(omega);
  return ((lam%360)+360)%360;
}
function termIndex(date){return Math.floor((((sunLongitude(jdOfNoon(date))-315)%360+360)%360)/15);}
function addDays(date,n){var d=new Date(date.getFullYear(),date.getMonth(),date.getDate());d.setDate(d.getDate()+n);return d;}
function getTermInfo(base){
  var changes=[],prev=termIndex(addDays(base,-46));
  for(var i=-45;i<=45;i++){var idx=termIndex(addDays(base,i));if(idx!==prev){changes.push({off:i,idx:idx});prev=idx;}}
  var last=null,next=null;
  for(var k=0;k<changes.length;k++){if(changes[k].off<=0)last=changes[k];else if(!next)next=changes[k];}
  var cur=last||{off:0,idx:termIndex(base)};
  return {name:TERM_NAMES[cur.idx],daysSince:-cur.off,
    nextName:next?TERM_NAMES[next.idx]:'下一节气',daysTo:next?next.off:15};
}
function solarTermInfo(date){var t=getTermInfo(date);return {name:t.name,next:t.nextName,toNext:t.daysTo,daysSince:t.daysSince};}
function seasonOf(name){var i=TERM_NAMES.indexOf(name);if(i<6)return '春';if(i<12)return '夏';if(i<18)return '秋';return '冬';}

  }
  if(hum!=null&&hum<=35){
    out.push({seg:'food',why:'空气偏干('+Math.round(hum)+'%)',text:'多喝温水，饮食偏温润；室内可加湿到 40–60%。'});
    out.push({seg:'risk',why:'空气偏干',text:'口鼻易干，回家后可清洗鼻腔；有呼吸道敏感者减少干冷时段户外。'});
  }
  if(wind!=null&&wind>=24){
    out.push({seg:'move',why:'风力偏大',text:'减少迎风时段，注意体感温度通常低于气温。'});
  }
  if(uv!=null&&uv>=6){
    out.push({seg:'risk',why:'紫外线偏强',text:'正午出门做遮挡，别在强光下久晒。'});
  }
  if(aqi!=null&&aqi>100){
    out.push({seg:'move',why:'空气质量偏差(AQI '+Math.round(aqi)+')',text:'运动改到室内，回家后清洗鼻腔。'});
    out.push({seg:'risk',why:'空气质量偏差',text:'敏感人群减少户外停留，运动时注意呼吸体感。'});
  }
  return out;
}

/* 组装一份完整日历：把三层叠加成最终文案 */
function buildCalendar(ctx){
  var date=ctx.date||new Date();
  var loc=ctx.loc||{province:'',city:'成都',county:'',name:'成都'};
  var w=ctx.weather||{ok:false};
  var lv=lunar(date),st=solarTermInfo(date),season=seasonOf(st.name);
  var base=TERM_DATA[st.name]||TERM_DATA['立冬'];
  var prof=profileOf([loc.province,loc.city,loc.county].join(''));
  var rules=weatherRules(w);
  var bySeg={yi:[],bu:[],sleep:[],food:[],move:[],mind:[],risk:[]};
  rules.forEach(function(r){if(bySeg[r.seg])bySeg[r.seg].push(r);});

  /* 今日主题：把区县气候 + 节气连起来 */
  var themeTitle=base[0];
  var wphrase=w.ok?('当地'+WEATHER_CODE[w.code]||'当地天气')+'、'+Math.round(w.tmin)+'–'+Math.round(w.tmax)+'℃':'天气暂不可用';
  var themeDesc=prof.label+'；'+st.name+'已过、距'+st.next+st.toNext+'天。'+wphrase+'。整体顺着节气把节奏收一收，具体按下面的当日提示微调。';

  /* 宜 / 不宜：节气基调 + 天气追加(宜) */
  var yi=base[1].slice(),bu=base[2].slice();
  bySeg.yi.forEach(function(r){yi.push(r.text);});
  bySeg.bu.forEach(function(r){bu.push(r.text);});

  /* 作息：季节作息 + 气候画像光照 + 天气增量 */
  var sleep=[SEASON_SLEEP[season],prof.light,'久坐打断：每坐满 1 小时起身接水、拉伸或远眺，雨天室内也能做。'];
  bySeg.sleep.forEach(function(r){sleep.push(r.text);});

  /* 饮食：节气饮食 + 画像饮食 + 通用节制 + 天气增量 */
  var food=[base[3],prof.diet,'节制：每餐七分饱，晚餐尽量 19:30 前吃完；温热水少量多次。'];
  bySeg.food.forEach(function(r){food.push(r.text);});

  /* 运动：节气运动 + 画像运动 + 通用原则 + 天气增量 */
  var move=[base[4],prof.move,'强度以"微微发热、不喘不累"为度，按体感随时下调；运动后及时擦干、换干衣。'];
  bySeg.move.forEach(function(r){move.push(r.text);});

  /* 情志：节气情志 + 画像情志 + 呼吸放松 */
  var mind=[base[5],prof.mind,'呼吸放松：紧绷时用"吸 4 秒—屏 2 秒—呼 6 秒"做 5 轮。'];

  /* 风险提醒：固定红旗 + 天气触发 */
  var risk=[
    '若运动后持续胸痛、胸闷、头晕，或关节急性肿痛、不明原因乏力，请立即停止并就医。',
    '有慢性病史或孕期的朋友，调整运动前建议先咨询专业医生。'
  ];
  bySeg.risk.forEach(function(r){risk.push(r.text);});

  /* 依据：内经 + 规范 + 运动科学 + 该区县气候与实况 */
  var basis=[
    ['内经',SEASON_QUOTE[season]+'（作养生取向，非诊疗）'],
    ['规范','国家中医药管理局《中医养生保健服务规范（试行）》，限养生科普，不含诊断/治疗/处方。'],
    ['运动','WHO《身体活动与久坐行为指南（2020）》、ACSM 运动处方建议——用于中低强度、按体感调整、打断久坐。'],
    ['气候',prof.label+'（省域长期气候参考，中国天气网/中央气象台）'],
    ['实况',(w.ok?('Open-Meteo 该区县精确坐标当日实况：'+(WEATHER_CODE[w.code]||'—')+'、'+Math.round(w.tmin)+'–'+Math.round(w.tmax)+'℃、湿度'+Math.round(w.hum)+'%、风'+Math.round(w.wind)+'km/h'+(w.aqi!=null?'、AQI '+Math.round(w.aqi):'')):'天气接口未返回，可点「刷新天气」重试')+'；节气按太阳黄经计算。']
  ];

  var doy=Math.floor((date-new Date(date.getFullYear(),0,0))/86400000);
  var oneLine=ONE_LINERS[doy%ONE_LINERS.length];

  /* 天气文案 */
  var wxLine=w.ok?(WEATHER_CODE[w.code]||'—')+' · '+Math.round(w.tmin)+'–'+Math.round(w.tmax)+'℃ · 湿度'+Math.round(w.hum)+'% · 风'+Math.round(w.wind)+'km/h'+(w.aqi!=null?' · AQI '+Math.round(w.aqi):''):'天气获取失败（需联网），养生建议仍按节气与该地气候给出';

  /* 自动调整清单（透明化，便于核对联动是否生效） */
  var adjustments=[{src:'区县',why:prof.label,text:'按省域长期气候调整：'+prof.light}];
  rules.forEach(function(r){adjustments.push({src:'当日天气',why:r.why,text:r.text});});

  return {
    dateText:(date.getMonth()+1)+'月'+date.getDate()+'日 · 星期'+'日一二三四五六'[date.getDay()],
    lunarText:'农历'+lv.month+lv.day+' · '+lv.year,
    termLine:st.name+'（距'+st.next+st.toNext+'天）',
    place:loc.name,
    profileLabel:prof.label,
    wxLine:wxLine,
    theme:{title:themeTitle,desc:themeDesc},
    yi:yi,bu:bu,sleep:sleep,food:food,move:move,mind:mind,risk:risk,
    basis:basis,oneLine:oneLine,adjustments:adjustments,
    chips:[prof.label,st.name+'·'+season+'季',(w.ok?'日出 '+w.sunrise+' · 日落 '+w.sunset:'天气仅当天有效')]
  };
}

    if(countyHits.length&&(countyHits[0].score===100||!cityHits.length)){

  function coordOf(o,known){
    if(o.gpsLat!=null&&o.gpsLon!=null)return {lat:o.gpsLat,lon:o.gpsLon,level:'GPS'};

  function parseIp(a,b){

      function sohu(){
        if(typeof document==='undefined')return fin(null);
        var s=document.createElement('script'),timer=null;
        s.src='https://pv.sohu.com/cityjson?ie=utf-8&_='+Date.now();
        function cleanup(){if(timer)clearTimeout(timer);if(s.parentNode)s.parentNode.removeChild(s);}

  function gps(timeout){

/* ---------- 意图路由 ---------- */
function route(t){
  /* 导出意图优先：说一句就能出图（卡片 / 长页 / 两份都要 / 切倍率）
     纯倍率说法（「切到1x」「用 2 倍」「原尺寸」）单独兜底，避免落到槽位收集 */
  if(/^\s*(切到|切成|换成|改成|用|设为|调成)?\s*[12]\s*[xX倍]\s*$|^\s*原尺寸\s*$|^\s*[12]倍图?\s*$|倍率|清晰度|高清图|原尺寸图/.test(t)){
    if(/1|原尺寸/.test(t))return 'export.scale1';
    return 'export.scale2';
  }
  if(/导出|出图|下载图片|下载图|存图|保存图|要图|给我图|来张图|导卡|出张图|出份图|PNG|png|两份都要|两张都要|两份图|两张图|都导出/i.test(t)){
    if(/1\s*[xX倍]|原尺寸|1倍|\b1x\b/i.test(t))return 'export.scale1';
    if(/2\s*[xX倍]|2倍|\b2x\b/i.test(t))return 'export.scale2';
    if(/两份|两张|都要|都导|全部|两个都|一起导|全导/.test(t))return 'export.both';
    if(/长页|长图|日历图|日历长/.test(t))return 'export.long';
    return 'export.card';
  }
  if(/为什么|依据是什么|凭什么|为啥|解释一下|依据是/.test(t))return 'explain';
  if(/换第|换一套|第\s*[一二三四五六七八九十\d]+\s*套|skin\s*=|换.*皮肤|换套/.test(t))return 'revise.skin';
  if(/换到|换成|改到|改成|改为|换为|我在|换个城市|换城市|所在城市|城市|地点|位置|地址|定位|换.*区|换.*县/.test(t)&&!/换第|第\s*[一二三四五六七八九十\d]+\s*套/.test(t))return 'revise.loc';
  if(/强度再降|再保守|降一档|强度低一点/.test(t))return 'revise.intensity';
  if(/只要\s*Markdown|只要长页|给我\s*Markdown|只出\s*md/i.test(t))return 'revise.md';
  if(/明天|后天/.test(t))return 'revise.date';
  if(/天气准吗|天气准不准|天气数据|取值时刻/.test(t))return 'revise.wx';
  if(/生成|出一份|来一份|做一份|开工|确认|好了|好$|可以|开始/.test(t))return 'confirm';
  if(/9\s*[:：]\s*16|做张卡|只要卡|来张卡|养生日历卡/.test(t))return 'card.only';
  if(/只要长页|只要.*日历|只要.*md/i.test(t))return 'calendar.only';
  return 'both';
}

/* ---------- 槽位抽取 ---------- */
function mkCounty(x){
  return {province:x.province,city:x.city,county:x.county,name:JXArea.fmt(x),pc:x.pc,
    code:x.pc+(x.ci!=null?String(x.ci).padStart(2,'0'):''),lat:null,lon:null};
}
function parseLoc(t){
  /* ① 先抠「…县 / 区 / 旗」片段定县级：整句里带了市名时，
        避免 JXArea.search 把市名当首个命中而误判为「只写到市级」 */
  var m=t.match(/([\u4e00-\u9fa5]{2,8}(?:省|自治区))?\s*([\u4e00-\u9fa5]{2,8}市)?\s*([\u4e00-\u9fa5]{2,10}(?:县|区|旗))/);
  if(m&&m[3]){
    /* 正则会贪婪吃掉省名（「陕西省眉县」整段），须剥掉省 / 市前缀再搜；
       单字县名（眉县 / 洋县 / 勉县）只有单独搜「眉县」才命中 */
    var seg=m[3],tries=[seg];
    var st=seg.replace(/^[\u4e00-\u9fa5]{2,8}(?:省|自治区|市)/,'');
    if(st&&st!==seg)tries.push(st);
    if(seg.length>=3)tries.push(seg.slice(-3));
    if(seg.length>=2)tries.push(seg.slice(-2));
    var h0=null;
    for(var ti=0;ti<tries.length&&!h0;ti++){
      h0=JXArea.search(tries[ti],8).filter(function(x){return x.kind==='county'})[0];
    }
    if(h0)return mkCounty(h0);
  }
  /* ② 整句搜索命中县级，直接采用 */
  var q=t.replace(/[，,。;；\s]/g,' ').trim();
  var cands=JXArea.search(q,8);
  if(cands.length&&cands[0].kind==='county')return mkCounty(cands[0]);
  /* ③ 全表模糊：取原话中包含的县级名（应对「在陕西汉中西乡县」这类不带后缀市名的写法） */
  var found=null;
  Object.keys(JX_AREA).forEach(function(pc){
    if(found)return;var pv=JX_AREA[pc][0];
    JX_AREA[pc][1].forEach(function(g){if(found)return;g[1].forEach(function(an){
      if(found)return;var s=an.replace(/(自治区|自治县|自治旗|特区|林区|省|市|区|县|旗)$/g,'');
      var hit=(s.length>=2&&t.indexOf(s)>=0)
        ||(s.length===1&&(t.indexOf(s+'县')>=0||t.indexOf(s+'区')>=0||t.indexOf(s+'旗')>=0));
      if(hit){found={province:pv,city:g[0],county:an,name:(pv===g[0]?'':pv)+(g[0]!==an?g[0]:'')+an,pc:pc,lat:null,lon:null}}
    })});
  });
  if(found)return found;
  /* ④ 确实只写到市级：不猜县、不反复追问，返回该市区县候选给 UI 一键补齐 */
  if(cands.length&&cands[0].kind==='city'){
    var b=cands[0];
    return {partial:true,kind:'city',province:b.province,city:b.city,pc:b.pc,ci:b.ci,
      name:(b.province&&b.province!==b.city?b.province:'')+b.city,
      counties:(b.counties||[]).slice()};
  }
  return null;
}
/* 用户这句话是不是在说地点（用于识别「说了却没解析出来」） */
function hasLocIntent(t){
  return /(?:换到|换成|改到|改成|改为|换为|我在|所在城市|城市|地点|位置|地址|定位)[\s\S]*[\u4e00-\u9fa5]/.test(t)
      ||/[\u4e00-\u9fa5]{2,8}(?:省|自治区)/.test(t)
      ||/[\u4e00-\u9fa5]{2,10}(?:县|区|旗)/.test(t)
      ||/在[\u4e00-\u9fa5]{2,10}/.test(t);
}
function extract(t){
  S.locWarn=false;
  var age=t.match(/(\d{2})\s*岁/);if(age)S.slots.age=age[1]+'岁';
  var hs=[];[/肩颈|肩膀|脖子|颈椎/,/喉咙|咽喉|有痰|痰/,/大汗|出汗|冒汗|易汗/,/怕冷|手脚凉/,/睡眠|失眠|熬夜/,/久坐|腰|膝/].forEach(function(r,i){
    var m=t.match(r);if(m)hs.push(['肩颈僵硬','喉咙有痰','运动后易大汗','怕冷','睡眠不佳','久坐腰膝'][i])});
  if(hs.length)S.slots.health=hs.join(' · ');
  if(CONSERV.test(t)){S.slots.constraints=true;S.slots.conservative=true}
  if(/不做强度|不上强度|高强度|力竭/.test(t))S.slots.intensity='中低 RPE 9–11（不上调）';
  var l=parseLoc(t),locBefore=S.slots.loc;
  if(l&&l.partial){S.locPending=l}             /* 市级 → 待补区县，属正常路径 */
  else if(l){
    S.slots.loc=l;S.locPending=null;
    /* 位置真的变了：旧天气 / 示例快照立刻作废，绝不拿西乡县实况冒充新地点 */
    if(!locBefore||locBefore.name!==l.name){S.weather=null;S.wxMode='未取数';S.wxAt=''}
  }
  else if(hasLocIntent(t)){S.locWarn=true;S.locPending=null}  /* 说了地点却没认出来 */
  var sk=t.match(/第\s*([一二三四五六七八九十]|\d+)\s*套/)||t.match(/skin\s*=\s*(\d+)/i);
  if(sk){var n=isNaN(+sk[1])?CN.indexOf(sk[1])+1:+sk[1];if(n>=1&&n<=10)S.slots.skin=n-1}
  var d=t.match(/(\d{4})[-\/年](\d{1,2})[-\/月](\d{1,2})/);
  if(d)S.slots.date=new Date(+d[1],+d[2]-1,+d[3]);
}

/* ---------- 收集 / 确认 ---------- */
/* 第②步固定为「一句话三段式」：年龄 + 身体状况（需要照顾的情况）+ 所在城市（省 / 市 / 区县） */
var SLOT_HINT='年龄 + 身体状况（需要照顾的情况）+ 所在城市（省 / 市 / 区县）';
var SLOT_EXAMPLE='42岁，久坐腰膝酸软，睡眠不佳，怕冷，在四川成都';

/* 只写到市级：列该市区县，一键补齐，不反复追问、不替用户猜 */
function showCountyPicker(){
  var p=S.locPending;if(!p)return;
  var list=(p.counties||[]).filter(Boolean);
  setPhase('collect','COLLECT');
  say('a','收到了。这句话里的「'+esc(p.name)+'」只到市级 —— 养生建议要按区县气候画像来调，补一个区县就齐了（下面点一下即可，也可以直接打字）。\n三段已收到：**年龄** '+(S.slots.age||'未填')+' · **身体状况** '+(S.slots.health||'未填')+' · **所在城市** '+esc(p.name)+'（待补区县）。');
  var rows=[
    ['年龄',esc(S.slots.age||'未填（不做推断）')],
    ['身体状况',esc(S.slots.health||'未填，按通用保守版')],
    ['所在城市',esc(p.name)+' · 待补区县'],
    ['候选区县','共 '+list.length+' 个，点下面按钮选或直接打字']
  ];
  var btns=list.slice(0,12).map(function(n){return {t:n,act:'county:'+n}});
  btns.push({t:'用默认值',act:'default',gh:true});
  say('s',cardHTML('补一个区县',rows,btns),'html');
  setStatus();
}
function pickCounty(nm){
  var p=S.locPending;if(!p)return;
  var hit=JXArea.search(nm,8).filter(function(x){return x.kind==='county'&&x.county===nm&&x.city===p.city})[0]
       || JXArea.search(nm,8).filter(function(x){return x.kind==='county'})[0];
  if(!hit){say('a','没在离线行政区表里定位到「'+esc(nm)+'」，换个区县名，或直接打完整地址（省 / 市 / 区县）试试。');return}
  S.slots.loc={province:hit.province,city:hit.city,county:hit.county,name:JXArea.fmt(hit),pc:hit.pc,
    code:hit.pc+(hit.ci!=null?String(hit.ci).padStart(2,'0'):''),lat:null,lon:null};
  S.locPending=null;saveMem();
  say('u','补到 '+nm);
  if(S.cal){say('a','已定位到 **'+esc(S.slots.loc.name)+'**。正在重取天气并重算两份产物（其余槽位不重问）…');doGenerate()}
  else{say('a','已定位到 **'+esc(S.slots.loc.name)+'**。三段都齐了，下面是生成前确认。');showConfirm()}
}
function confirmOrAsk(useDefault){
  if(useDefault){S.locPending=null}
  else if(S.locPending){showCountyPicker();return}
  if(!S.slots.loc){
    if(useDefault){
      /* 无位置不能编天气；但可用「天气缺席 + 通用画像」生成 */
      S.slots.loc={province:'',city:'',county:'',name:'未指定（通用温和版）',pc:'',lat:null,lon:null};

    }else{

      say('s',cardHTML('也可以直接选',[
        ['示例（三段）','年龄 42 岁 · 身体状况 久坐 / 畏寒 / 睡眠不佳 · 所在城市 四川成都锦江区'],
        ['默认','不填身体情况，按通用保守版']
      ],[{t:'用示例情况',act:'demo'},{t:'用默认值',act:'default',gh:true}]),'html');
      setStatus();return;
    }
  }

}
function showConfirm(){
  setPhase('confirm','CONFIRM');
  var s=S.slots;
  var rows=[
    ['日期',esc((s.date||today()).getFullYear()+'-'+String((s.date||today()).getMonth()+1).padStart(2,'0')+'-'+String((s.date||today()).getDate()).padStart(2,'0'))+'（默认今天）'],

    ['强度',esc(s.intensity)+(s.conservative?' · conservative（先问医生）':'')],
    ['皮肤',s.skin!=null?('第 '+CN[s.skin]+' 套 · '+esc(SKINS[s.skin].name)):'按天气自动匹配'],
    ['产物',S.intent==='card.only'?'仅 9:16 卡':S.intent==='calendar.only'?'仅长页':'长页 + 9:16 卡']
  ];
  say('a','已收集齐，接下来查当日天气 + 离线历法，跑三层规则引擎，出「长页 + 9:16 卡」。要改现在说，或直接点下面「确认并生成」。');
  say('s',cardHTML('生成前确认',rows,[{t:'确认并生成',act:'gen'},{t:'载入示例天气快照',act:'snapshot',gh:true}]),'html');

/* ---------- 天气 ---------- */
function loadSnapshot(){
  if(S.slots.loc&&/西乡/.test(S.slots.loc.name)&&!(S.slots.date&&S.slots.date.getDate()!==8)){
    S.weather=DEMO_WX;S.wxMode='示例快照';S.wxAt='11:15';
    say('a','已载入**已核实的示例快照**：2026-11-08 11:15 陕西汉中西乡县 Open-Meteo 实况（阴 15.2℃ / 9.7–17.1℃ / 湿度 43% / 阵风 22.0 km·h⁻¹ / AQI 51 / UV 2.1）。\n注意：这是**演示用快照**，只适用于该地点该日期；换城市或换日期会自动失效并回到「天气缺席」，绝不拿它冒充别处实况。');
    setStatus();
  }else{
    say('a','示例快照只对应「陕西汉中西乡县 · 2026-11-08」，当前位置或日期不匹配，不能套用（否则就是编数据）。\n可以点「用示例情况」把位置与日期一起对齐，或联网时我自动取当日实况。');
  }
}
async function fetchWx(loc,date){
  var c=JXArea.coordOf(loc,[]);
  var lat=c.lat,lon=c.lon;
  var ctl=new AbortController();var timer=setTimeout(function(){ctl.abort()},4200);
  try{
    var u='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+
      '&current=temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m,weather_code'+
      '&daily=temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max,precipitation_sum,wind_speed_10m_max'+
      '&timezone=Asia%2FShanghai&forecast_days=1';
    var r=await fetch(u,{signal:ctl.signal});var j=await r.json();
    var d=j.daily||{},cur=j.current||{};
    var out={ok:true,code:cur.weather_code!=null?cur.weather_code:3,temp:cur.temperature_2m,feel:cur.apparent_temperature,
      tmax:d.temperature_2m_max?d.temperature_2m_max[0]:null,tmin:d.temperature_2m_min?d.temperature_2m_min[0]:null,
      hum:cur.relative_humidity_2m,wind:cur.wind_speed_10m,gust:d.wind_speed_10m_max?d.wind_speed_10m_max[0]:cur.wind_speed_10m,
      uv:d.uv_index_max?d.uv_index_max[0]:null,aqi:null,rain:d.precipitation_sum?d.precipitation_sum[0]:0,
      sunrise:(d.sunrise?d.sunrise[0]:'').slice(11,16),sunset:(d.sunset?d.sunset[0]:'').slice(11,16),
      at:new Date().toTimeString().slice(0,5),src:'Open-Meteo 实况 · '+c.level+'坐标'};
    clearTimeout(timer);return out;
  }catch(e){clearTimeout(timer);return null}
}

/* ---------- 生成 ---------- */
async function doGenerate(){
  var s=S.slots;
  if(!s.date)s.date=today();
  /* 天气：示例快照优先（且仅当位置/日期匹配）；否则联网；再否则明说缺席 */
  if(S.weather&&S.wxMode==='示例快照'&&(!s.loc||/西乡/.test(s.loc.name))&&s.date.getDate()===8){
    /* 沿用已核实快照 */
  }else if(s.loc&&s.loc.lat!=null||s.loc&&s.loc.pc){
    say('a','正在取当日实况（4 秒超时）… 断网也不会编数字，会明确标注「天气缺席」。');
    var w=await fetchWx(s.loc,s.date);
    if(w){S.weather=w;S.wxMode='联网实况';S.wxAt=w.at}
    else{S.weather={ok:false};S.wxMode='天气缺席';S.wxAt=''}
  }else{S.weather={ok:false};S.wxMode='天气缺席';S.wxAt=''}
  var ctx={date:s.date,loc:s.loc,weather:S.weather};
  var cal=buildCalendar(ctx);
  /* 个人化保守增量（不改写 cal 已有文案，只追加说明与强度上限） */
  cal.profile={age:s.age,health:s.health,conservative:s.conservative,intensity:s.intensity};
  if(s.health&&/大汗|出汗|冒汗/.test(s.health)){
    cal.move.unshift('硬上限：背部一开始冒汗就降速或结束，宁可少做 5 分钟，不要练到大汗后受风。');
    cal.bu.unshift('不追求大汗，不做力竭、冲刺或高强度间歇。');
    cal.yi.unshift('分层穿衣，热了先脱外层，别一次脱到单衣。');
  }
  if(s.health&&/肩颈|肩膀|脖子/.test(s.health)){
    cal.move.push('肩颈温和动作（非治疗）：收下巴、肩绕环、肩胛后缩，全程缓慢、不痛为准；不做快速甩头与暴力扳动。');
  }
  if(s.health&&/痰|咽喉|喉咙/.test(s.health)){
    cal.food.push('咽喉舒适护理：温水、适宜室内湿度、外出挡风、减少刺激与过度用嗓。不含药膳、食疗方、药材或任何化痰偏方。');
  }
  if(s.conservative){
    cal.risk.unshift('你提到的情况属于需要更谨慎的范围：调整运动前建议先咨询专业医生；本版强度再降一档。');
  }
  /* 内观五问：按自述派生，只记录事实 */
  cal.questions=[
    '今天肩颈的紧，是起床时最明显，还是久坐后更明显？左右有差别吗？',
    '喉咙的不适，喝温水后有没有缓和？一天里哪个时段明显？',
    '今天活动到第几分钟、做了哪个动作时背部开始出汗？',
    '到下午手脚还凉吗？在风口待过后有没有更不舒服？',
    '睡前脑子静下来了吗，还在转明天的事吗？'
  ];
  weatherExtra(cal,S.weather);
  /* 个性化主题：由「自述易大汗 + 当日偏干/有风」触发，长页与卡片同源覆写，不破坏单一数据源 */
  var pw=S.weather||{ok:false};
  if(/大汗|出汗|冒汗/.test(s.health||'')&&pw.ok&&((pw.hum!=null&&pw.hum<=45)||(pw.gust!=null&&pw.gust>=20))){
    cal.theme={title:'防风就温，勿令大汗',
      desc:'立冬刚过，'+cal.place+'今日偏干有风、昼夜温差大。今日只守一条：暖得起来，却不出大汗；万一出汗，立刻擦干避风。'};
  }
  S.cal=cal;
  if(s.skin==null){S.skin=pickSkin(S.weather)}else{S.skin=s.skin}
  saveMem();saveLast();
  renderAll();
  deliver();
}
/* 天气增量补充：既有 weatherRules 看持续风与湿度阈值；
   这里补「阵风 / 昼夜温差」两条解释性调整，带 why 供 explain 回溯，只给生活方式建议 */
function weatherExtra(cal,w){
  if(!w||!w.ok)return;
  var add=function(why,text,seg){
    cal.adjustments.push({src:'当日天气',why:why,text:text});
    if(seg==='move')cal.move.push(text);else if(seg==='risk')cal.risk.push(text);else if(seg==='food')cal.food.push(text);
  };
  if(w.gust!=null&&w.gust>=20)add('阵风偏大('+Math.round(w.gust)+' km/h)','减少迎风时段，选背风处活动；体感温度通常低于气温，出汗后立刻避风。','move');
  if(w.hum!=null&&w.hum<=45)add('空气偏干('+Math.round(w.hum)+'%)','多喝温水、室内可加湿到舒适区间；口鼻易干，回家后可清洗鼻腔。','food');
  if(w.tmax!=null&&w.tmin!=null&&(w.tmax-w.tmin)>=7)add('昼夜温差大('+(w.tmax-w.tmin).toFixed(1)+'℃)','分层穿衣，早晚加一件；别一次脱到单衣，汗后及时加回外层。','risk');
}
function pickSkin(w){
  if(!w||!w.ok)return Math.floor(Math.random()*10);
  if((w.gust!=null&&w.gust>=20)||(w.hum!=null&&w.hum<=45))return 2;
  if(w.tmax!=null&&w.tmax<=5)return 3;
  if(w.tmax!=null&&w.tmax>=30)return 8;
  if(w.aqi!=null&&w.aqi>100)return 4;
  var rain=w.rain!=null&&w.rain>=0.1;var code=w.code;
  if((code>=51&&code<=67)||rain)return 5;
  return Math.floor(Math.random()*10);
}

/* PNG 导出引擎：把产物 DOM + 全量内联 CSS 塞进一次性 foreignObject → canvas → PNG。
   注意：svg 只作为 data URL 交给 Image，从不插入页面 DOM，页面与卡面仍是零配图。 */
function pngFileName(kind){
  var d=dateSlug();
  return kind==='long'?('中医身体日历-长页-'+d+'.png'):('国风养生日历卡-9x16-'+d+'.png');
}
function domToPNG(kind,scale){
  return new Promise(function(resolve,reject){
    var el=$(kind==='card'?'card':'long');
    if(!el||!el.innerHTML.trim()){reject('还没有生成产物');return}
    var W=1080,H=1920,css='';
    document.querySelectorAll('style').forEach(function(x){css+=x.textContent+'\n'});
    css=css.replace(/:root\s*\{/g,':root,div{');        /* foreignObject 内 :root 不一定匹配，显式挂到 div */
    var extra=[
      'html,body{margin:0;padding:0;background:#fff}',
      '.card{transform:none!important;box-shadow:none!important;margin:0!important}',
      '.long{max-width:none!important;width:'+W+'px!important;box-shadow:none!important;margin:0!important}'
    ].join('\n');
    /* 离屏量化：长页固定 1080 宽后测真实高度，卡片固定 1080×1920 */
    var host=document.createElement('div');
    host.style.cssText='position:absolute;left:-99999px;top:0;visibility:hidden;width:'+W+'px';
    var clone=el.cloneNode(true);clone.removeAttribute('id');

    var h=kind==='long'?Math.ceil(clone.getBoundingClientRect().height):H;
    host.remove();

    var xhtml=new XMLSerializer().serializeToString(clone);
    var svg='<'+'svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+h+'">'
      +'<foreignObject x="0" y="0" width="'+W+'" height="'+h+'">'
      +'<div xmlns="http://www.w3.org/1999/xhtml" style="width:'+W+'px;height:'+h+'px;margin:0;padding:0;background:#fff">'
      +'<style><![CDATA['+css+'\n'+extra+']]></style>'+xhtml+'</div></foreignObject></svg>';
    var img=new Image();

        var ctx=cv.getContext('2d');ctx.scale(scale,scale);
        ctx.fillStyle='#fff';ctx.fillRect(0,0,W,h);ctx.drawImage(img,0,0);
        var done=function(blob){resolve({blob:blob,w:W*scale,h:h*scale})};
        if(cv.toBlob)cv.toBlob(function(b){b?done(b):reject('PNG 编码失败')},'image/png');

    img.onerror=function(){reject('浏览器未能渲染导出图')};

/* ---------- 主入口 ---------- */
function handle(t){
  t=String(t||'').trim();if(!t)return;
  /* 1 安全闸门前置 */
  var g=safety(t);
  if(g.level==='conservative'){
    say('a','你提到的情况属于需要更谨慎的范围：本版强度再降一档，并加「先咨询医生」。这不构成任何医学判断，其余建议照常生成。');
  }else if(boundaryReply(g)){return}
  /* 2 意图路由 */
  var it=route(t);
  if(it.indexOf('export.')===0){doExportChat(it);return}
  if(it==='confirm'&&S.phase==='confirm'){doGenerate();return}
  if(it==='explain'){doExplain();return}
  /* 首次（还没产物）说改城市：走收集流程，别被 doRevise 的「先生成一份」挡住 */
  if(it.indexOf('revise.')===0&&!(it==='revise.loc'&&!S.cal)){doRevise(it,t);return}
  /* 3 收集槽位 */
  var locBefore=S.slots.loc?S.slots.loc.name:null;
  extract(t);
  var locAfter=S.slots.loc?S.slots.loc.name:null;
  var locChanged=!!(locAfter&&locAfter!==locBefore);
  if(S.locWarn){
    say('a','没识别到你写的地点。当前位置仍是**本机记忆里的 '+esc(locAfter||'未指定')+'**，我不会拿它冒充你刚说的地方。\n请把城市写全一点：「省 / 市 / 区县」，例如「陕西省宝鸡市眉县」「成都双流区」；也可以直接点下方示例重新选。');
    setStatus();return;
  }
  if(it==='card.only')S.intent='card.only';
  else if(it==='calendar.only')S.intent='calendar.only';
  else S.intent='both';
  /* 位置真的变了：已交付 → 立刻重算两份产物；未交付 → 明确回显后再确认 */
  if(locChanged&&S.cal){
    say('a','所在城市已改为 **'+esc(locAfter)+'**（原 '+esc(locBefore||'未指定')+'）。正在重取该地天气并重算两份产物，其余槽位不重问…');
    doGenerate();return;
  }
  if(locChanged&&!S.cal){
    say('a','所在城市已更新为 **'+esc(locAfter)+'**（原 '+esc(locBefore||'未指定')+'）。还没生成过产物，回「生成」或点「确认并生成」即按新城市出两份成品。');
  }
  confirmOrAsk(false);
}

    var d=S.slots.date||today();d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);S.slots.date=d;
    S.weather={ok:false};S.wxMode='排期预览（天气留空）';S.wxAt='';
    var cal=buildCalendar({date:d,loc:S.slots.loc,weather:{ok:false}});
    cal.profile=S.cal.profile;cal.questions=S.cal.questions;S.cal=cal;renderAll();
    say('a','日期改到 '+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'：历法重算、天气留空（排期预览，不编数字），位置与身体情况不变。');return;
  }
  if(it==='revise.wx'){say('a','天气来源：'+(S.wxMode||'天气缺席')+(S.wxAt?'，取值时刻 '+S.wxAt:'')+'。'+(S.weather&&S.weather.src?'接口：'+S.weather.src:'')+'\n只回显取值时刻，不重新生成产物。天气只取当日实况，断网就明说缺席，绝不编数字。');return}
}
$('btnSend').onclick=function(){var v=$('inp').value.trim();if(!v)return;$('inp').value='';say('u',v);handle(v)};
$('inp').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('btnSend').click()}});

/* ---------- 启动 ---------- */
function boot(){
  loadMem();
  var q=new URLSearchParams(location.search),ex=q.get('export');
  var isExport=!!ex&&ex!=='0',exLong=ex==='long';
  if(q.get('scale')==='1')PNG_SCALE=1;
  var restored=loadLast();
  if(q.has('skin')){var n=parseInt(q.get('skin'),10);if(n>=1&&n<=10)S.skin=n-1}
  if(isExport&&restored){
    document.body.classList.add('export-on');
    if(exLong)document.body.classList.add('export-long');
    $('btnExport').classList.add('on');$('btnExport').textContent='退出导出';
    $('btnPngScale').textContent=PNG_SCALE+'x';syncExViewBtn();
    S.phase='delivered';setPhase('delivered','DELIVERED');
    renderAll();switchTab(exLong?'long':'card');setStatus();
    toast(exLong?'长页导出态：可下载「长页 PNG」（整页长图）。':'9:16 卡导出态：可下载「9:16 卡 PNG」。');
    return;
  }
  buildGallery();setStatus();
  if(restored){S.phase='delivered';setPhase('delivered','DELIVERED');renderAll()}
  say('a','你好，我是**顺时 · 中医身体日历对答智能体**。\n用大白话说一句就行，一次问齐就出两份成品：长页 + 9:16 国风卡。\n\n先说清楚边界：只做**日常养生教育**，不诊断、不开方药 / 药膳 / 穴位、不判吉凶、不承诺疗效；运动默认中低强度、保守安全。');
  say('s',cardHTML('怎么用',[
    ['① 开口','「生成今天的身体日历」或直接点下方示例'],
    ['② 答一句','年龄 + 身体状况（需要照顾的情况）+ 省 / 市 / 区县'],
    ['　例','42岁，久坐腰膝酸软，睡眠不佳，怕冷，在四川成都'],
    ['　补全','写到区县最准；只写到市，我把该市区县列出来点一下即可'],
    ['③ 生成','我查天气 + 历法，跑三层规则引擎'],
    ['④ 收两份','长页 + 9:16 卡；说「导出卡片」直接下载 PNG'],
    ['⑤ 出图','说「导出卡片」/「导出长页」/「两份都要」，或点顶栏「导出卡片」'],
    ['⑥ 想改','换城市 / 换第 N 套 / 降强度 / 解释依据'],
    ['⑦ 留意','红旗与落款说明用对话文字告知，不上卡面']
  ],null),'html');
  if(isExport&&!restored)say('a','「导出模式」需要先生成一份日历：我先留在工作站。生成后点右上角「导出模式」，或用 `?export=1`（卡）/ `?export=long`（长页）单开链接，就能直接下载两份 PNG。');
  if(S.slots.loc)say('a','已从本机记忆恢复位置：**'+esc(S.slots.loc.name)+'**'+(S.slots.health?'，以及个人情况：'+esc(S.slots.health):'')+'。直接说「生成」即可；想换地方说「换到 XX 区」。');
  if(restored)say('a','已恢复上次生成的「'+esc(S.cal.theme.title)+'」（'+esc(S.cal.place)+'）。可以直接改：换城市 / 换第 N 套 / 降强度 / 解释依据。');
  else say('a','也可以点「示例天气快照」载入已核实的西乡县 2026-11-08 实况（仅演示用，换城市不会冒充别处数据）。');
  switchTab('long');syncExViewBtn();
}
boot();
</script>
